<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF-to-AI Chatbot</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --chat-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --user-bubble: #e0e7ff;
            --ai-bubble: #f3f4f6;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar untuk Upload */
        .sidebar {
            width: 300px;
            background-color: #ffffff;
            border-right: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .upload-box {
            border: 2px dashed var(--border-color);
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            background: #fafafa;
            transition: all 0.3s ease;
        }

        .upload-box:hover {
            border-color: var(--primary);
            background: #f5f5ff;
        }

        .upload-box input {
            display: none;
        }

        .upload-box label {
            cursor: pointer;
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        #uploadStatus {
            font-size: 0.85rem;
            text-align: center;
            font-weight: 500;
        }

        .status-success { color: #10b981; }
        .status-error { color: #ef4444; }
        .status-process { color: var(--primary); }

        /* Area Utama Chat */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            position: relative;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .message-content {
            background-color: var(--primary);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.ai .message-content {
            background-color: var(--ai-bubble);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        /* Animasi Loading / Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: var(--text-muted);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Input Form Chat */
        .chat-input-area {
            padding: 24px;
            border-top: 1px solid var(--border-color);
            background-color: var(--chat-bg);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            align-items: center;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px;
            font-size: 0.95rem;
            outline: none;
            color: var(--text-main);
        }

        .input-wrapper button {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .input-wrapper button:hover {
            background-color: var(--primary-hover);
        }

        .input-wrapper button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Knowledge Base</h2>
        <div class="upload-box" onclick="document.getElementById('pdfFile').click()">
            <input type="file" id="pdfFile" accept="application/pdf" onchange="updateFileName(this)">
            <label id="uploadLabel">
                <svg style="width:32px; height:32px; margin-bottom:8px; fill:var(--text-muted);" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                <br>Click to browse PDF file
            </label>
        </div>
        <button class="btn" id="uploadBtn" onclick="upload()">Upload & Index</button>
        <p id="uploadStatus"></p>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            PDF-to-AI Assistant
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="message-content">Halo! Silakan unggah dokumen PDF di sidebar terlebih dahulu, lalu tanyakan apa saja mengenai isi dokumen tersebut di sini.</div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="query" placeholder="Tanyakan sesuatu tentang PDF Anda..." onkeydown="if(event.key === 'Enter') ask()">
                <button onclick="ask()" id="sendBtn" title="Kirim Pesan">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        function updateFileName(input) {
            const label = document.getElementById('uploadLabel');
            if(input.files.length > 0) {
                label.innerText = input.files[0].name;
            } else {
                label.innerHTML = `<svg style="width:32px; height:32px; margin-bottom:8px; fill:var(--text-muted);" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg><br>Click to browse PDF file`;
            }
        }

        async function upload() {
            const fileInput = document.getElementById('pdfFile');
            const status = document.getElementById('uploadStatus');
            const btn = document.getElementById('uploadBtn');
            
            if (fileInput.files.length === 0) return alert("Pilih berkas PDF terlebih dahulu!");
            
            status.className = "status-process";
            status.innerText = "Sedang mengunggah & memproses PDF...";
            btn.disabled = true;
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            try {
                const response = await fetch('/ingest', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    status.className = "status-success";
                    status.innerText = "PDF Berhasil di-index! Siap digunakan.";
                } else {
                    status.className = "status-error";
                    status.innerText = "Gagal memproses dokumen PDF.";
                }
            } catch (error) {
                status.className = "status-error";
                status.innerText = "Terjadi kesalahan koneksi.";
            } finally {
                btn.disabled = false;
            }
        }

        async function ask() {
            const queryInput = document.getElementById('query');
            const query = queryInput.value.trim();
            const chatMessages = document.getElementById('chatMessages');
            const sendBtn = document.getElementById('sendBtn');
            
            if (!query) return;
            
            // 1. Bersihkan input & matikan tombol sementara
            queryInput.value = "";
            queryInput.disabled = true;
            sendBtn.disabled = true;

            // 2. Tampilkan pesan User ke dalam layout chat
            appendMessage(query, 'user');
            
            // 3. Tampilkan element Loading (Typing Indicator) untuk AI
            const loadingDiv = appendLoadingIndicator();
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query: query})
                });

                // Hapus indikator loading setelah response mulai diterima
                loadingDiv.remove();

                if (!response.ok) {
                    appendMessage("Maaf, terjadi kesalahan saat mengambil data.", 'ai');
                    return;
                }

                // 4. Buat kontainer pesan kosong untuk menampung streaming teks AI
                const aiMessageDiv = appendMessage("", 'ai');
                const contentDiv = aiMessageDiv.querySelector('.message-content');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const {done, value} = await reader.read();
                    if (done) {
                        console.log("Stream finished");
                        break;
                    }
                    const chunk = decoder.decode(value, {stream: true});
                    console.log("Received chunk:", chunk);
                    
                    // Tambahkan chunk teks ke kontainer AI secara berkala (real-time)
                    contentDiv.innerText += chunk;
                    
                    // Auto-scroll ke bawah saat teks bertambah
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }

            } catch (error) {
                if (document.getElementById('typingIndicator')) {
                    document.getElementById('typingIndicator').remove();
                }
                appendMessage("Gagal terhubung ke server.", 'ai');
                console.error(error);
            } finally {
                // Kembalikan keadaan input seperti semula
                queryInput.disabled = false;
                sendBtn.disabled = false;
                queryInput.focus();
            }
        }

        function appendMessage(text, sender) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            
            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            contentDiv.innerText = text;
            
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            
            // Auto-scroll ke bawah
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        function appendLoadingIndicator() {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', 'ai');
            messageDiv.id = 'typingIndicator';
            
            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            
            const indicator = document.createElement('div');
            indicator.classList.add('typing-indicator');
            indicator.innerHTML = '<span></span><span></span><span></span>';
            
            contentDiv.appendChild(indicator);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            
            return messageDiv;
        }
    </script>
</body>
</html>
